<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Admin | Viettel Post Recruitment Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="64x64" href="/ViettelPost/assets/viettel-v-favicon.png?v=4">
  <style>
    :root { color-scheme: light; font-family: "Be Vietnam Pro", "Noto Sans", Arial, sans-serif; font-synthesis: none; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; min-height: 100%; overflow: hidden; background: #fff; }
    #adminFrame { display: block; position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; margin: 0; padding: 0; background: #fff; }
    #fallback { display: none; position: fixed; z-index: 9; inset: 0; padding: 24px; background: #fff; color: #252a31; font: 14px/1.6 "Be Vietnam Pro", "Noto Sans", Arial, sans-serif; }
    #fallback .panel { width: min(580px, 100%); margin: min(12vh, 90px) auto 0; padding: 24px; border: 1px solid #e4e7eb; border-radius: 14px; }
    #fallback h1 { margin: 0 0 12px; font-size: 22px; line-height: 1.4; }
    #fallback p { color: #626b76; }
    #fallback a { color: #c91e2b; overflow-wrap: anywhere; }
    .admin-wrapper-attribution { display: grid; gap: 6px; padding: 15px 0; margin: 16px 0; border-top: 1px solid #eceef0; border-bottom: 1px solid #eceef0; color: #555e68; font-size: 11px; line-height: 1.65; overflow-wrap: anywhere; }
    .admin-wrapper-attribution strong { color: #292d33; }
    #fallback button { min-height: 42px; border: 0; border-radius: 8px; padding: 0 16px; background: #df202d; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
  <script src="/ViettelPost/config.js?v=20261024-6" onerror="window.__VPR_CONFIG_LOAD_ERROR__=true"></script>
</head>
<body>
  <!-- Admin is embedded directly so the address bar remains /ViettelPost/Admin/. -->
  <iframe id="adminFrame" title="Viettel Post Recruitment Admin" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <section id="fallback" aria-live="polite">
    <div class="panel">
      <h1>Không mở được trang quản trị / Admin could not be loaded</h1>
      <p id="fallbackMessage">Không thể tải giao diện quản trị. Bạn có thể mở trực tiếp Apps Script để kiểm tra deployment.</p>
      <p><a id="directLink" href="#" rel="noopener">Mở Admin trực tiếp trên Google Apps Script</a></p>
      <div class="admin-wrapper-attribution"><strong>© Viettel Post Thành phố Hồ Chí Minh</strong><span>Phát triển bởi Vũ Nguyễn Hoàng Phúc · <a href="mailto:Phucvnh@viettel.com.vn">Phucvnh@viettel.com.vn</a></span></div>
      <button id="retryButton" type="button">Thử lại / Retry</button>
    </div>
  </section>
  <script>
  (function () {
    'use strict';
    // Fallback keeps the Admin route usable if GitHub Pages has a stale/missing config.js.
    const FALLBACK_GAS_URL = 'https://script.google.com/macros/s/AKfycbzOP1YDX3XPpxgUvgG3GPD3dlkZSJ4a8lTdNrzfaDF0QKYd2NK74GjjLwvNaYnr72WG/exec';
    const frame = document.getElementById('adminFrame');
    const fallback = document.getElementById('fallback');
    const fallbackMessage = document.getElementById('fallbackMessage');
    const directLink = document.getElementById('directLink');
    const configUrl = String((window.VPR_CONFIG && window.VPR_CONFIG.GAS_WEB_APP_URL) || '').trim();

    function validGasUrl(value) {
      try {
        const u = new URL(value);
        return u.protocol === 'https:' && u.hostname === 'script.google.com' && u.pathname.includes('/macros/s/') && u.pathname.endsWith('/exec');
      } catch (_) { return false; }
    }
    function buildAdminUrl(value) {
      const u = new URL(value);
      u.searchParams.set('page', 'admin');
      u.searchParams.set('embed', 'github');
      return u.toString();
    }
    const gasUrl = validGasUrl(configUrl) ? configUrl : FALLBACK_GAS_URL;
    const adminUrl = buildAdminUrl(gasUrl);
    directLink.href = buildAdminUrl(gasUrl).replace(/[?&]embed=github/, '');
    if (window.__VPR_CONFIG_LOAD_ERROR__ || !validGasUrl(configUrl)) {
      // Do not block login just because config.js failed. Continue with the known deployment URL.
      fallbackMessage.textContent = 'Đang dùng URL GAS dự phòng vì chưa đọc được config.js. Nếu màn hình đăng nhập vẫn không xuất hiện, hãy cập nhật deployment GAS (New version) để cho phép nhúng trang Admin. / Using the built-in GAS URL because config.js could not be read.';
    }
    frame.addEventListener('error', function () {
      fallback.style.display = 'block';
    });
    document.getElementById('retryButton').addEventListener('click', function () {
      fallback.style.display = 'none';
      frame.src = adminUrl + (adminUrl.includes('?') ? '&' : '?') + '_reload=' + Date.now();
    });
    frame.src = adminUrl;
  })();
  </script>
</body>
</html>
